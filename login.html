<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | K.D Hostel Management System</title>


<!-- Bootstrap CSS -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<!-- CSS -->

<link rel="stylesheet" href="css/style.css">


</head>


<body class="bg-light">



<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container">


<a class="navbar-brand d-flex align-items-center" href="index.html">


<img src="images/logo.png"
width="50"
height="50"
class="rounded-circle bg-white p-1 me-2">


<div>

<h5 class="mb-0 fw-bold">

K.D HOSTEL

</h5>

<small>

Management System

</small>

</div>


</a>



</div>

</nav>







<!-- Login Section -->


<section class="container py-5">


<div class="row justify-content-center">


<div class="col-md-5">



<div class="card shadow p-4">



<div class="text-center mb-4">


<i class="fa-solid fa-user-lock fa-3x text-primary"></i>


<h2 class="mt-3 text-primary fw-bold">

Login

</h2>


<p>

K.D Hostel Management System

</p>


</div>








<form onsubmit="loginUser(event)">



<!-- Role -->

<div class="mb-3">


<label class="form-label">

Select Role

</label>


<select id="role" class="form-select" required>


<option value="">

Choose Role

</option>


<option value="admin">

Admin

</option>


<option value="student">

Student

</option>


</select>


</div>







<!-- Username -->


<div class="mb-3">


<label class="form-label">

Username

</label>


<div class="input-group">


<span class="input-group-text">

<i class="fa fa-user"></i>

</span>


<input type="text"
id="username"
class="form-control"
placeholder="Enter Username"
required>


</div>


</div>








<!-- Password -->


<div class="mb-3">


<label class="form-label">

Password

</label>


<div class="input-group">


<span class="input-group-text">

<i class="fa fa-lock"></i>

</span>


<input type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>


</div>


</div>






<button class="btn btn-primary w-100 fw-bold">


<i class="fa fa-right-to-bracket"></i>

Login


</button>




</form>



<hr>



<div class="text-center">


<a href="index.html" class="text-decoration-none">

← Back To Home

</a>


</div>



</div>


</div>


</div>


</section>







<!-- Footer -->


<footer class="bg-primary text-white text-center py-3">


<p class="mb-0">

© 2026 K.D Hostel Management System

</p>


</footer>









<script>


function loginUser(event){


event.preventDefault();



let role = document.getElementById("role").value;



if(role=="admin"){


window.location.href="admin/dashboard.html";


}



else if(role=="student"){


window.location.href="student/dashboard.html";


}



else{


alert("Please Select Login Role");


}



}



</script>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
