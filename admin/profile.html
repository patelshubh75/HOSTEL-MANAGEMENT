<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile | K.D Hostel</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">

<div class="container-fluid">


<a class="navbar-brand fw-bold">

<i class="fa-solid fa-building"></i>

K.D Hostel Admin Panel

</a>


<a href="../index.html" class="btn btn-warning">

Logout

</a>


</div>

</nav>






<div class="container-fluid">

<div class="row">



<!-- Sidebar -->


<div class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">


<h5 class="text-white text-center">

Admin Menu

</h5>


<hr class="text-white">



<a href="dashboard.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-dashboard"></i>
Dashboard

</a>


<a href="students.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-users"></i>
Students

</a>


<a href="rooms.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-bed"></i>
Rooms

</a>


<a href="hostel.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-building"></i>
Hostel

</a>


<a href="fees.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-money-bill"></i>
Fees

</a>


<a href="complaints.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-comment"></i>
Complaints

</a>


<a href="notices.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-bell"></i>
Notices

</a>


<a href="reports.html" class="btn btn-dark text-white w-100 mb-2">

<i class="fa fa-chart-bar"></i>
Reports

</a>


<a href="profile.html" class="btn btn-primary w-100 mb-2">

<i class="fa fa-user"></i>
Profile

</a>


</div>







<!-- Main Content -->


<div class="col-md-9 col-lg-10 p-4">



<h2 class="text-primary fw-bold">

Admin Profile

</h2>


<hr>






<div class="row">



<!-- Profile Card -->


<div class="col-md-4">


<div class="card shadow text-center p-4">


<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
width="120"
class="rounded-circle mx-auto mb-3">


<h4>

Admin User

</h4>


<p class="text-muted">

Hostel Administrator

</p>


<button class="btn btn-primary">

Change Photo

</button>


</div>


</div>







<!-- Profile Information -->


<div class="col-md-8">


<div class="card shadow p-4">


<h4 class="text-primary">

Personal Information

</h4>


<hr>




<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label">

Full Name

</label>


<input type="text"
class="form-control"
value="Admin User">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

Email Address

</label>


<input type="email"
class="form-control"
value="admin@kdhostel.com">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

Mobile Number

</label>


<input type="text"
class="form-control"
value="9876543210">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

Role

</label>


<input type="text"
class="form-control"
value="Administrator"
readonly>


</div>



</div>





<button class="btn btn-success">

<i class="fa fa-save"></i>

Update Profile

</button>



</div>


</div>



</div>








<!-- Change Password -->


<div class="card shadow mt-4">


<div class="card-body">


<h4 class="text-primary">

Change Password

</h4>


<hr>




<div class="row">


<div class="col-md-4">


<input type="password"
class="form-control"
placeholder="Old Password">


</div>



<div class="col-md-4">


<input type="password"
class="form-control"
placeholder="New Password">


</div>



<div class="col-md-4">


<input type="password"
class="form-control"
placeholder="Confirm Password">


</div>


</div>



<br>


<button class="btn btn-warning">

<i class="fa fa-key"></i>

Change Password

</button>


</div>


</div>





</div>


</div>


</div>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
